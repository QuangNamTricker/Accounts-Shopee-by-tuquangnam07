<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Accounts Shopee by tuquangnam07</title>

<script src="https://cdn.tailwindcss.com"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, getDocs, doc, deleteDoc,
    updateDoc, onSnapshot, query, orderBy, serverTimestamp,
    increment
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ===== FIREBASE CONFIG =====
  const firebaseConfig = {
    apiKey: "AIzaSyBArweay4vxW3WzEaR9BpbSRVFM_YikIGk",
    authDomain: "account-shopee-tqn.firebaseapp.com",
    projectId: "account-shopee-tqn",
    storageBucket: "account-shopee-tqn.firebasestorage.app",
    messagingSenderId: "985422043627",
    appId: "1:985422043627:web:09fe94be2b09696f3b61ae",
    measurementId: "G-G7X8LXKFN0"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ===== STATE =====
  let accounts = [];
  let currentAccountId = null;
  let currentTab = 'info';
  let searchTerm = '';
  let filterStatus = 'all';
  let viewMode = 'table'; // 'table' | 'card'

  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);

  // ===== TOAST =====
  window.showToast = (msg, type = 'success') => {
    const colors = { success: 'bg-green-500', error: 'bg-red-500', info: 'bg-blue-500' };
    const toast = document.createElement('div');
    toast.className = `fixed top-5 right-5 ${colors[type]} text-white px-5 py-3 rounded-lg shadow-lg z-[9999] transition-all duration-300 translate-x-full`;
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.classList.remove('translate-x-full'), 50);
    setTimeout(() => {
      toast.classList.add('translate-x-full');
      setTimeout(() => toast.remove(), 300);
    }, 2500);
  };

  // ===== HELPERS =====
  const escapeHtml = (str) => String(str ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));

  const formatDate = (d) => {
    if (!d) return '—';
    try {
      // Nếu là Timestamp Firestore
      if (d.toDate) d = d.toDate();
      // Nếu là string dd/mm/yyyy hoặc yyyy-mm-dd
      if (typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d)) {
        const [y, m, day] = d.split('-');
        return `${day}/${m}/${y}`;
      }
      if (typeof d === 'string' && /^\d{2}\/\d{2}\/\d{4}$/.test(d)) return d;
      const date = new Date(d);
      if (isNaN(date)) return d;
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      return `${day}/${month}/${date.getFullYear()}`;
    } catch { return d; }
  };

  const todayInput = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  };

  // ===== STATUS BADGE =====
  const statusBadge = (status) => {
    const map = {
      active:  { text: 'Đang dùng',  cls: 'bg-green-100 text-green-700 border-green-300',   dot: 'bg-green-500' },
      pending: { text: 'Chưa mua',   cls: 'bg-yellow-100 text-yellow-700 border-yellow-300', dot: 'bg-yellow-500' },
      bought:  { text: 'Đã mua',     cls: 'bg-blue-100 text-blue-700 border-blue-300',      dot: 'bg-blue-500' },
      sold:    { text: 'Đã bán',     cls: 'bg-red-100 text-red-700 border-red-300',         dot: 'bg-red-500' },
      locked:  { text: 'Bị khóa',    cls: 'bg-gray-100 text-gray-700 border-gray-300',      dot: 'bg-gray-500' },
    };
    const s = map[status] || map.pending;
    return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-medium rounded-full border ${s.cls} whitespace-nowrap">
      <span class="w-1.5 h-1.5 rounded-full ${s.dot}"></span>${s.text}
    </span>`;
  };

  const orderStatusText = (status) => {
    const map = {
      pending:  { text: 'Chờ xử lý',  cls: 'bg-yellow-100 text-yellow-700' },
      shipping: { text: 'Đang giao',  cls: 'bg-blue-100 text-blue-700' },
      done:     { text: 'Hoàn thành', cls: 'bg-green-100 text-green-700' },
      cancel:   { text: 'Đã hủy',     cls: 'bg-red-100 text-red-700' },
    };
    const s = map[status] || map.pending;
    return `<span class="px-2 py-0.5 text-xs rounded-full ${s.cls}">${s.text}</span>`;
  };

  // ===== ADD ACCOUNT MODAL =====
  window.openAddModal = () => {
    $('#addModal').classList.remove('hidden');
    $('#addModal').classList.add('flex');
    $('#createdAtInput').value = todayInput();
  };
  window.closeAddModal = () => {
    $('#addModal').classList.add('hidden');
    $('#addModal').classList.remove('flex');
    $('#addForm').reset();
  };

  window.handleAddAccount = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true;
    btn.innerHTML = '⏳ Đang lưu...';

    try {
      const form = e.target;
      const data = {
        username: form.username.value.trim(),
        password: form.password.value.trim(),
        phone: form.phone.value.trim(),
        email: form.email.value.trim(),
        deviceCreated: form.deviceCreated.value.trim(),
        deviceBought: form.deviceBought.value.trim(),
        accountCreatedAt: form.accountCreatedAt.value || '',
        accountBoughtAt: form.accountBoughtAt.value || '',
        status: form.status.value,
        note: form.note.value.trim(),
        orderCount: 0,
        createdAtServer: serverTimestamp()
      };

      await addDoc(collection(db, 'accounts'), data);
      window.showToast('✅ Đã thêm tài khoản!');
      closeAddModal();
    } catch (err) {
      console.error(err);
      window.showToast('❌ Lỗi: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '💾 Lưu tài khoản';
    }
  };

  // ===== LOAD ACCOUNTS =====
  const loadAccounts = () => {
    const q = query(collection(db, 'accounts'), orderBy('createdAtServer', 'desc'));
    onSnapshot(q, (snapshot) => {
      accounts = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      renderAccounts();
      renderStats();
    }, (err) => {
      console.error('Load error:', err);
      getDocs(collection(db, 'accounts')).then(snap => {
        accounts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderAccounts();
        renderStats();
      });
    });
  };

  // ===== STATS =====
  const renderStats = () => {
    const total = accounts.length;
    const totalOrders = accounts.reduce((s, a) => s + (a.orderCount || 0), 0);
    const active = accounts.filter(a => a.status === 'active' || a.status === 'bought').length;
    const sold = accounts.filter(a => a.status === 'sold').length;
    $('#statTotal').textContent = total;
    $('#statOrders').textContent = totalOrders;
    $('#statActive').textContent = active;
    $('#statSold').textContent = sold;
  };

  // ===== RENDER ACCOUNTS (TABLE VIEW - giống Excel) =====
  const renderAccounts = () => {
    let list = accounts;

    if (searchTerm) {
      const t = searchTerm.toLowerCase();
      list = list.filter(a =>
        (a.username || '').toLowerCase().includes(t) ||
        (a.phone || '').toLowerCase().includes(t) ||
        (a.email || '').toLowerCase().includes(t)
      );
    }
    if (filterStatus !== 'all') {
      list = list.filter(a => a.status === filterStatus);
    }

    const container = $('#accountContainer');

    if (list.length === 0) {
      container.innerHTML = `
        <div class="text-center py-20 text-gray-400">
          <div class="text-6xl mb-3">📭</div>
          <p class="text-lg">Chưa có tài khoản nào</p>
          <p class="text-sm mt-1">Nhấn "Thêm Account" để bắt đầu</p>
        </div>`;
      return;
    }

    if (viewMode === 'table') {
      container.innerHTML = `
        <div class="bg-white rounded-xl border overflow-hidden shadow-sm">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-gray-50 border-b">
                <tr class="text-left text-gray-600 text-xs uppercase tracking-wider">
                  <th class="px-3 py-3 font-semibold">Tài Khoản</th>
                  <th class="px-3 py-3 font-semibold">Mật Khẩu</th>
                  <th class="px-3 py-3 font-semibold">SĐT</th>
                  <th class="px-3 py-3 font-semibold">Email</th>
                  <th class="px-3 py-3 font-semibold">TB Tạo</th>
                  <th class="px-3 py-3 font-semibold">TB Mua</th>
                  <th class="px-3 py-3 font-semibold">Ngày Tạo</th>
                  <th class="px-3 py-3 font-semibold">Ngày Mua</th>
                  <th class="px-3 py-3 font-semibold">Trạng Thái</th>
                  <th class="px-3 py-3 font-semibold text-center">Đơn</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-100">
                ${list.map(a => `
                  <tr onclick="openDetail('${a.id}')"
                    class="hover:bg-orange-50/50 cursor-pointer transition">
                    <td class="px-3 py-3 font-medium text-gray-800">
                      <div class="flex items-center gap-2">
                        <div class="w-7 h-7 rounded-full bg-gradient-to-br from-orange-400 to-orange-600 text-white flex items-center justify-center font-bold text-xs flex-shrink-0">
                          ${(a.username || '?')[0].toUpperCase()}
                        </div>
                        <span>${escapeHtml(a.username || 'N/A')}</span>
                      </div>
                    </td>
                    <td class="px-3 py-3 text-gray-600 font-mono text-xs">
                      <span class="pwd-mask" data-pwd="${escapeHtml(a.password || '')}">••••••</span>
                    </td>
                    <td class="px-3 py-3 text-gray-600 whitespace-nowrap">${escapeHtml(a.phone || '—')}</td>
                    <td class="px-3 py-3 text-gray-600 max-w-[180px] truncate">${escapeHtml(a.email || '—')}</td>
                    <td class="px-3 py-3 text-gray-600">${escapeHtml(a.deviceCreated || '—')}</td>
                    <td class="px-3 py-3 text-gray-600">${escapeHtml(a.deviceBought || '—')}</td>
                    <td class="px-3 py-3 text-gray-600 whitespace-nowrap">${formatDate(a.accountCreatedAt)}</td>
                    <td class="px-3 py-3 text-gray-600 whitespace-nowrap">${formatDate(a.accountBoughtAt)}</td>
                    <td class="px-3 py-3">${statusBadge(a.status)}</td>
                    <td class="px-3 py-3 text-center">
                      <span class="inline-flex items-center justify-center min-w-[28px] h-7 px-2 bg-orange-100 text-orange-700 rounded-full font-semibold text-xs">
                        ${a.orderCount || 0}
                      </span>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    } else {
      container.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          ${list.map(a => `
            <div onclick="openDetail('${a.id}')"
              class="group bg-white rounded-xl border hover:border-orange-400 hover:shadow-lg transition-all cursor-pointer overflow-hidden">
              <div class="p-5">
                <div class="flex items-start justify-between mb-3">
                  <div class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-full bg-gradient-to-br from-orange-400 to-orange-600 text-white flex items-center justify-center font-bold text-lg shadow">
                      ${(a.username || '?')[0].toUpperCase()}
                    </div>
                    <div>
                      <h3 class="font-semibold text-gray-800 group-hover:text-orange-600 transition">
                        ${escapeHtml(a.username || 'N/A')}
                      </h3>
                      <p class="text-xs text-gray-500">${escapeHtml(a.phone || 'Chưa có SĐT')}</p>
                    </div>
                  </div>
                  ${statusBadge(a.status)}
                </div>
                <div class="space-y-1.5 text-sm text-gray-600 border-t pt-3">
                  <div class="flex justify-between">
                    <span class="text-gray-400">📧 Email:</span>
                    <span class="truncate max-w-[160px] text-right text-xs">${escapeHtml(a.email || '—')}</span>
                  </div>
                  <div class="flex justify-between">
                    <span class="text-gray-400">📱 Thiết bị:</span>
                    <span class="truncate max-w-[160px] text-right text-xs">${escapeHtml(a.deviceCreated || '—')}</span>
                  </div>
                  <div class="flex justify-between">
                    <span class="text-gray-400">🛒 Đơn hàng:</span>
                    <span class="font-medium text-orange-600">${a.orderCount || 0}</span>
                  </div>
                  <div class="flex justify-between">
                    <span class="text-gray-400">📅 Ngày tạo:</span>
                    <span class="text-xs">${formatDate(a.accountCreatedAt)}</span>
                  </div>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }
  };

  // ===== SEARCH & FILTER =====
  window.handleSearch = (e) => { searchTerm = e.target.value; renderAccounts(); };
  window.handleFilter = (e) => { filterStatus = e.target.value; renderAccounts(); };
  window.toggleView = () => {
    viewMode = viewMode === 'table' ? 'card' : 'table';
    $('#viewIcon').textContent = viewMode === 'table' ? '⊞' : '☰';
    $('#viewLabel').textContent = viewMode === 'table' ? 'Dạng thẻ' : 'Dạng bảng';
    renderAccounts();
  };

  // ===== OPEN DETAIL =====
  window.openDetail = (id) => {
    currentAccountId = id;
    currentTab = 'info';
    const acc = accounts.find(a => a.id === id);
    if (!acc) return;
    $('#detailModal').classList.remove('hidden');
    $('#detailModal').classList.add('flex');
    renderDetail();
  };

  window.closeDetail = () => {
    $('#detailModal').classList.add('hidden');
    $('#detailModal').classList.remove('flex');
    currentAccountId = null;
  };

  window.switchTab = (tab) => { currentTab = tab; renderDetail(); };

  // ===== RENDER DETAIL =====
  const renderDetail = async () => {
    const acc = accounts.find(a => a.id === currentAccountId);
    if (!acc) return;

    $('#detailName').textContent = acc.username || 'N/A';
    $('#detailAvatar').textContent = (acc.username || '?')[0].toUpperCase();
    $('#detailPhone').textContent = acc.phone || 'Chưa có SĐT';

    $$('.tab-btn').forEach(b => {
      const isActive = b.dataset.tab === currentTab;
      b.className = `tab-btn px-5 py-3 font-medium border-b-2 transition whitespace-nowrap ${
        isActive
          ? 'border-orange-500 text-orange-600'
          : 'border-transparent text-gray-500 hover:text-gray-700'
      }`;
    });

    const content = $('#detailContent');
    if (currentTab === 'info') {
      content.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          ${infoField('👤 Tài khoản', acc.username)}
          ${infoField('🔒 Mật khẩu', acc.password, true)}
          ${infoField('📞 SĐT', acc.phone)}
          ${infoField('📧 Email', acc.email)}
          ${infoField('📱 Thiết bị tạo', acc.deviceCreated)}
          ${infoField('🛍️ Thiết bị mua', acc.deviceBought)}
          ${infoField('📅 Ngày tạo acc', formatDate(acc.accountCreatedAt))}
          ${infoField('💰 Ngày mua acc', formatDate(acc.accountBoughtAt))}
          <div>
            <p class="text-xs text-gray-500 mb-1">Trạng thái</p>
            ${statusBadge(acc.status)}
          </div>
          <div>
            <p class="text-xs text-gray-500 mb-1">Tổng đơn hàng</p>
            <span class="inline-flex items-center gap-1 px-3 py-1 bg-orange-100 text-orange-700 rounded-full text-sm font-semibold">
              📦 ${acc.orderCount || 0} đơn
            </span>
          </div>
          ${acc.note ? `<div class="md:col-span-2">
            <p class="text-xs text-gray-500 mb-1">📝 Ghi chú</p>
            <p class="text-sm text-gray-700 bg-gray-50 rounded-lg p-3">${escapeHtml(acc.note)}</p>
          </div>` : ''}
        </div>
        <div class="flex justify-end mt-6 pt-4 border-t">
          <button onclick="deleteAccount('${acc.id}')"
            class="px-4 py-2 text-sm text-red-600 border border-red-300 rounded-lg hover:bg-red-50 transition">
            🗑️ Xóa tài khoản
          </button>
        </div>
      `;
    } else if (currentTab === 'orders') {
      content.innerHTML = `
        <div class="flex justify-between items-center mb-4">
          <div>
            <p class="text-sm text-gray-500">Lịch sử đơn hàng đã mua bằng acc này</p>
            <p class="text-xs text-orange-500 mt-0.5">💡 Voucher đã dùng gắn với từng đơn hàng</p>
          </div>
          <button onclick="openAddOrder()"
            class="px-4 py-2 bg-orange-500 hover:bg-orange-600 text-white text-sm font-medium rounded-lg transition shadow whitespace-nowrap">
            + Thêm đơn hàng
          </button>
        </div>
        <div id="ordersList" class="space-y-3">
          <div class="text-center py-10 text-gray-400">⏳ Đang tải đơn hàng...</div>
        </div>
      `;
      await loadOrders(acc.id);
    }
  };

  const infoField = (label, value, isPassword = false) => `
    <div>
      <p class="text-xs text-gray-500 mb-1">${label}</p>
      ${isPassword && value
        ? `<div class="flex items-center gap-2">
            <span class="text-sm font-medium text-gray-800 font-mono" data-pwd>••••••••</span>
            <button onclick="togglePwd(this, '${escapeHtml(value).replace(/'/g, "\\'")}')"
              class="text-xs text-orange-500 hover:underline">Hiện</button>
          </div>`
        : `<p class="text-sm font-medium text-gray-800 break-words">${escapeHtml(value || '—')}</p>`}
    </div>
  `;

  window.togglePwd = (btn, pwd) => {
    const span = btn.previousElementSibling;
    if (span.textContent === '••••••••') {
      span.textContent = pwd;
      btn.textContent = 'Ẩn';
    } else {
      span.textContent = '••••••••';
      btn.textContent = 'Hiện';
    }
  };

  // ===== ORDERS =====
  const loadOrders = async (accountId) => {
    const list = $('#ordersList');
    if (!list) return;
    try {
      const snap = await getDocs(collection(db, 'accounts', accountId, 'orders'));
      const orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      orders.sort((a, b) => (b.orderDate || '').localeCompare(a.orderDate || ''));

      if (orders.length === 0) {
        list.innerHTML = `
          <div class="text-center py-12 text-gray-400 bg-gray-50 rounded-xl border-2 border-dashed">
            <div class="text-5xl mb-2">📦</div>
            <p>Chưa có đơn hàng nào</p>
            <p class="text-xs mt-1">Nhấn "+ Thêm đơn hàng" để ghi lại đơn đầu tiên</p>
          </div>`;
        return;
      }

      list.innerHTML = orders.map((o, idx) => `
        <div class="bg-white border border-gray-200 rounded-xl p-4 hover:border-orange-300 transition">
          <div class="flex items-start justify-between gap-3 mb-2">
            <div class="flex items-start gap-3 flex-1">
              <div class="w-8 h-8 rounded-lg bg-orange-100 text-orange-600 flex items-center justify-center font-bold text-sm flex-shrink-0">
                ${orders.length - idx}
              </div>
              <div class="flex-1 min-w-0">
                <p class="font-semibold text-gray-800">${escapeHtml(o.productName || 'Không tên SP')}</p>
                ${o.orderCode ? `<p class="text-xs text-gray-400 mt-0.5">Mã đơn: <span class="font-mono">${escapeHtml(o.orderCode)}</span></p>` : ''}
              </div>
            </div>
            <button onclick="deleteOrder('${accountId}', '${o.id}', ${o._orderCount || 0})"
              class="text-red-400 hover:text-red-600 text-sm flex-shrink-0">🗑️</button>
          </div>

          ${o.voucherUsed ? `
            <div class="mt-3 flex items-center gap-2 bg-gradient-to-r from-orange-50 to-yellow-50 border border-orange-200 rounded-lg p-2.5">
              <span class="text-lg">🎟️</span>
              <div class="flex-1">
                <p class="text-xs text-gray-500">Voucher đã dùng</p>
                <p class="font-mono text-sm font-bold text-orange-700">${escapeHtml(o.voucherUsed)}</p>
              </div>
              <button onclick="copyText('${escapeHtml(o.voucherUsed).replace(/'/g, "\\'")}')"
                class="px-2 py-1 text-xs bg-white border border-orange-300 text-orange-600 rounded hover:bg-orange-50 transition">
                📋 Copy
              </button>
            </div>
          ` : ''}

          <div class="flex flex-wrap gap-x-4 gap-y-1.5 text-xs text-gray-500 mt-3 pt-3 border-t">
            ${o.shopName ? `<span>🏪 ${escapeHtml(o.shopName)}</span>` : ''}
            ${o.price ? `<span>💰 ${Number(o.price).toLocaleString('vi-VN')}đ</span>` : ''}
            ${o.orderDate ? `<span>📅 ${formatDate(o.orderDate)}</span>` : ''}
            <span>${orderStatusText(o.status)}</span>
          </div>
        </div>
      `).join('');
    } catch (err) {
      list.innerHTML = `<p class="text-red-500 text-sm">Lỗi tải đơn: ${err.message}</p>`;
    }
  };

  window.copyText = (text) => {
    navigator.clipboard.writeText(text).then(() => {
      window.showToast('📋 Đã copy: ' + text);
    }).catch(() => {
      window.showToast('❌ Không copy được', 'error');
    });
  };

  // ===== ADD ORDER MODAL =====
  window.openAddOrder = () => {
    $('#orderModal').classList.remove('hidden');
    $('#orderModal').classList.add('flex');
    $('#orderDateInput').value = todayInput();
  };
  window.closeOrderModal = () => {
    $('#orderModal').classList.add('hidden');
    $('#orderModal').classList.remove('flex');
    $('#orderForm').reset();
  };

  window.handleAddOrder = async (e) => {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true;
    btn.innerHTML = '⏳ Đang lưu...';

    try {
      const orderData = {
        productName: form.productName.value.trim(),
        voucherUsed: form.voucherUsed.value.trim(),
        shopName: form.shopName.value.trim(),
        price: Number(form.price.value) || 0,
        orderCode: form.orderCode.value.trim(),
        orderDate: form.orderDate.value || todayInput(),
        status: form.status.value,
        createdAt: serverTimestamp()
      };
      await addDoc(collection(db, 'accounts', currentAccountId, 'orders'), orderData);

      // Tăng orderCount
      await updateDoc(doc(db, 'accounts', currentAccountId), {
        orderCount: increment(1)
      });

      window.showToast('✅ Đã thêm đơn hàng!');
      closeOrderModal();
      loadOrders(currentAccountId);
    } catch (err) {
      window.showToast('❌ ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '💾 Lưu đơn hàng';
    }
  };

  window.deleteOrder = async (accountId, orderId) => {
    if (!confirm('Xóa đơn hàng này?')) return;
    try {
      await deleteDoc(doc(db, 'accounts', accountId, 'orders', orderId));
      await updateDoc(doc(db, 'accounts', accountId), {
        orderCount: increment(-1)
      });
      window.showToast('🗑️ Đã xóa đơn');
      loadOrders(accountId);
    } catch (err) {
      window.showToast('❌ ' + err.message, 'error');
    }
  };

  // ===== DELETE ACCOUNT =====
  window.deleteAccount = async (id) => {
    if (!confirm('Bạn chắc chắn muốn xóa tài khoản này?\nTất cả đơn hàng cũng sẽ bị xóa.')) return;
    try {
      const ordersSnap = await getDocs(collection(db, 'accounts', id, 'orders'));
      await Promise.all(ordersSnap.docs.map(d => deleteDoc(d.ref)));
      await deleteDoc(doc(db, 'accounts', id));
      window.showToast('🗑️ Đã xóa tài khoản');
      closeDetail();
    } catch (err) {
      window.showToast('❌ ' + err.message, 'error');
    }
  };

  // ===== SHOW PASSWORD IN TABLE =====
  document.addEventListener('click', (e) => {
    const mask = e.target.closest('.pwd-mask');
    if (mask) {
      if (mask.textContent === '••••••') {
        mask.textContent = mask.dataset.pwd || '';
        mask.classList.add('text-orange-600');
      } else {
        mask.textContent = '••••••';
        mask.classList.remove('text-orange-600');
      }
    }
  });

  // ===== INIT =====
  document.addEventListener('DOMContentLoaded', () => {
    loadAccounts();
  });
</script>
